# Production compose — runs on the EC2 host.
#
# STANDALONE file (not an overlay). EC2 never builds anything; everything
# is pulled from GitHub Container Registry. This is the entire fix for the
# t3.micro OOM during `next build`.
#
# Usage on the EC2 host:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d

services:
  backend:
    image: ghcr.io/${GITHUB_USER:-dklochana}/cannabis-backend:latest
    pull_policy: always
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SYNC_DATABASE_URL: ${SYNC_DATABASE_URL}
      ENV: ${ENV:-prod}
      CORS_ORIGINS: ${CORS_ORIGINS}
      APP_VERSION: ${APP_VERSION:-0.1.0}
    expose:
      - "8000"
    mem_limit: 384m
    mem_reservation: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    image: ghcr.io/${GITHUB_USER:-dklochana}/cannabis-frontend:latest
    pull_policy: always
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 256m
    mem_reservation: 192m
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    mem_limit: 64m
    mem_reservation: 32m
    restart: unless-stopped
