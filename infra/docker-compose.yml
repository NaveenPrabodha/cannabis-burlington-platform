# docker-compose for local dev + AWS EC2 production.
#
# Profiles:
#   local — full stack with bundled Postgres (single command for a new dev)
#   prod  — backend + frontend + nginx; backend talks to AWS RDS via .env
#
# Usage:
#   Local:  docker compose --profile local up -d
#   Prod:   docker compose --profile prod up -d

services:
  db:
    image: postgres:16-alpine
    profiles: [local]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_local_only}
      POSTGRES_DB: cannabis_analysis
    volumes:
      - cannabis_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cannabis_analysis"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    profiles: [local, prod]
    environment:
      DATABASE_URL: ${BACKEND_DATABASE_URL:-postgresql+asyncpg://postgres:changeme_local_only@db:5432/cannabis_analysis}
      ENV: ${ENV:-local}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost}
      APP_VERSION: ${APP_VERSION:-0.1.0}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
        required: false
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:8000}
    profiles: [local, prod]
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    profiles: [prod]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  cannabis_pgdata:
