[project]
name = "cannabis-pipeline"
version = "0.1.0"
description = "Scrapers + ETL jobs for the Burlington cannabis price comparison platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psycopg2-binary>=2.9.10",
    "sqlalchemy>=2.0.36",
    "httpx>=0.28.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    "playwright>=1.49.0",
    "playwright-stealth>=1.0.6",
    "pandas>=2.2.0",
    "rapidfuzz>=3.10.1",
    "tenacity>=9.0.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    "boto3>=1.35.0",
    "prefect>=3.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
